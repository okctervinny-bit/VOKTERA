<!DOCTYPE html>
<html lang="id">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <meta name="theme-color"
          content="#ff9f43">

    <title>VOKTERA</title>

    <link rel="manifest"
          href="manifest.json">

    <link rel="stylesheet"
          href="style.css">

</head>

<body>

    <header>

        <h1>VOKTERA</h1>

        <p>
            Virtual Knowledge & Digital Literacy Arena
        </p>

        <strong>
            Baca • Telusuri • Analisis • Ciptakan
        </strong>

    </header>


    <main>

        <h2>Selamat Datang di VOKTERA</h2>

        <p>
            Arena literasi digital untuk membaca,
            menelusuri, menganalisis, dan menciptakan
            informasi secara kritis dan kreatif.
        </p>


        <section class="menu">

            <button onclick="baca()">

                📖

                <h3>BACA</h3>

                <p>
                    Membaca dan memahami informasi.
                </p>

            </button>


            <button onclick="telusuri()">

                🔎

                <h3>TELUSURI</h3>

                <p>
                    Menemukan dan mengecek sumber.
                </p>

            </button>


            <button onclick="analisis()">

                🧠

                <h3>ANALISIS</h3>

                <p>
                    Menganalisis fakta dan informasi.
                </p>

            </button>


            <button onclick="ciptakan()">

                ✍️

                <h3>CIPTAKAN</h3>

                <p>
                    Menghasilkan karya digital.
                </p>

            </button>

        </section>

    </main>


    <footer>

        <p>
            © 2026 VOKTERA
        </p>

    </footer>


    <script src="app.js"></script>

</html>
